# Compiles HexRevival.exe from source on GitHub's servers and attaches it to the release.
name: Build launcher
on:
  push:
    paths: [ "tools/launcher/**" ]
  release:
    types: [ published ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile (.NET Framework 4 csc)
        shell: cmd
        run: >
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /target:winexe /optimize+
          /out:HexRevival.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll
          tools\launcher\HexRevivalLauncher.cs
      - name: Checksum
        shell: pwsh
        run: Get-FileHash HexRevival.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: HexRevival-launcher
          path: HexRevival.exe
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" HexRevival.exe --clobber
