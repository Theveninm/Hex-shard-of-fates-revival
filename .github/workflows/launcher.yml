# Compiles HexRevival.exe from source on GitHub's servers, as a check that the launcher builds.
# The release archive (launcher + mod) is built on a PC with the game: the mod needs the game's assemblies.
name: Build launcher
on:
  push:
    paths: [ "tools/launcher/**" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compile (.NET Framework 4 csc)
        shell: cmd
        run: >
          C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /target:winexe /optimize+
          /out:HexRevival.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll
          tools\launcher\HexRevivalLauncher.cs
      - name: Checksum
        shell: pwsh
        run: Get-FileHash HexRevival.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v5
        with:
          name: HexRevival-launcher
          path: HexRevival.exe
